<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --navy:#0E2A52; --aqua:#167F9E; --cyan:#62D5E8;
  --grad:linear-gradient(125deg,var(--navy) 20%,var(--aqua));
  --red:#C8323F; --pass:#3CCB98;
  --viable:#EC2024; --viable-ink:#D0182A;
  --paper:#F2F5F9; --sheet:#FFFFFF; --wash:#E4F2F7; --ink:var(--navy); --ink-2:#3A4967; --muted:#5F6D88; --line:#D9E1EB; --field:#76859B;
  --on-dark-2:#C3D0E6; --on-dark-3:#93A5C5; --dark-line:rgba(195,208,230,.17);
  --display:"Archivo","Arial Nova","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;

  --t-hero:clamp(2.3rem,4.43vw - 1px,4rem); --t-h2:clamp(1.75rem,1rem + 1.9vw,2.65rem);
  --t-h3:clamp(1.18rem,1.06rem + .55vw,1.55rem); --t-lead:clamp(1.06rem,1rem + .36vw,1.26rem);
  --gut:clamp(20px,4.2vw,64px); --max:1320px; --inset:clamp(8px,1.4vw,24px);
  --r-sheet:clamp(22px,3vw,40px); --r-panel:clamp(16px,2.2vw,28px);
  --ease:cubic-bezier(.2,.7,.1,1); --focus:var(--aqua);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--navy);color:var(--ink);font:400 1.02rem/1.6 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
@supports (overflow:clip){body{overflow-x:clip}}
svg,canvas{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-stretch:112%;font-weight:640;letter-spacing:-.028em;line-height:1.03;margin:0;text-wrap:balance}
p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}
.dark{--focus:#fff;color:#fff}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ic{width:20px;height:20px;flex:none}
.wrap{width:min(100% - 2*var(--gut),var(--max));margin-inline:auto}
.sec{padding-block:clamp(56px,6.4vw,96px)}
.sec-head{display:grid;gap:18px;max-width:840px;margin-bottom:clamp(28px,3.4vw,48px)}
.sec-head h2,.h2{font-size:var(--t-h2)}
.sec-head p,.lead{font-size:var(--t-lead);line-height:1.5;color:var(--ink-2);max-width:60ch}
.sec-head.row{max-width:none;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px}
.sec-head.row>div:first-child{display:grid;gap:18px;max-width:840px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.tag{display:inline-block;justify-self:start;padding:5px 12px;border-radius:999px;font:600 .8rem/1.25 var(--body);background:var(--wash);color:var(--navy);white-space:nowrap}
.tag.new{background:var(--red);color:#fff}
.eyebrow{display:flex;align-items:center;gap:12px;font:600 .8rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.eyebrow::before{content:"";flex:none;width:28px;height:3px;border-radius:2px;background:var(--aqua)}
.dark .eyebrow{color:#fff}
.dark .eyebrow::before{background:var(--cyan)}
.eyebrow .tag{letter-spacing:0;text-transform:none}
.sec-head .eyebrow{margin-bottom:-4px}
.svc-copy .eyebrow{margin-bottom:-12px}
.auto-copy .eyebrow,.cgrid .eyebrow{margin-bottom:-8px}
.y30-copy .eyebrow{margin-bottom:-6px}

.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 26px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:600 1rem/1 var(--body);text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .5s var(--ease),color .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--aqua);transform:translateY(102%);transition:transform .5s var(--ease)}
.btn:hover::before,.btn:focus-visible::before{transform:none}
.btn.cy{background:var(--cyan);color:var(--navy)}.btn.cy::before{background:#fff}
.btn.gh{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 34%,transparent)}
@media (max-width:400px){.btn{white-space:normal;text-align:center;line-height:1.2;padding-block:10px}.hdr-cta .btn{white-space:nowrap}}
.btn.gh::before{background:color-mix(in srgb,currentColor 11%,transparent)}
.btn.my{gap:10px;padding:0 18px 0 5px;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.34)}
.btn.my::before{background:rgba(255,255,255,.12)}
.my .lock{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff}
.my .lock .ic{width:15px;height:15px}
.btn.sm{min-height:42px;padding:0 18px;font-size:.93rem}
.btn .ic{width:16px;height:16px}
.go{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);transition:transform .5s var(--ease),background .3s,box-shadow .3s,color .3s}
a:hover>.go,a:focus-visible>.go{background:var(--cyan);box-shadow:none;color:var(--navy);transform:rotate(-45deg)}

.skip{position:fixed;left:16px;top:-80px;z-index:90;padding:10px 16px;border-radius:999px;background:#fff;color:var(--ink);font-weight:600}
.skip:focus{top:14px}
.hdr{position:fixed;inset:0 0 auto;z-index:50;padding:14px var(--gut) 0;pointer-events:none}
.hdr-in{pointer-events:auto;display:flex;align-items:center;gap:18px;max-width:var(--max);height:64px;margin-inline:auto;padding:0 10px 0 20px;border-radius:999px;transition:background .45s,box-shadow .45s,max-width .7s var(--ease),height .45s var(--ease)}
.hdr.stuck .hdr-in{max-width:1140px;height:58px;background:rgba(14,42,82,.8);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 14px 40px -14px rgba(3,10,26,.6),inset 0 0 0 1px rgba(255,255,255,.09)}
.menu-open .hdr-in{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.brand{display:inline-flex;align-items:center;gap:10px;flex:none;text-decoration:none;font:700 1.16rem/1 var(--display);font-stretch:108%;letter-spacing:-.02em}
.brand img{display:block;height:52px;width:auto;transition:height .45s var(--ease)}
.hdr.stuck .brand img{height:42px}
.nav{position:relative;display:flex;margin-inline:auto}
.nav a{position:relative;z-index:1;display:inline-flex;align-items:center;height:38px;padding:0 15px;border-radius:999px;color:var(--on-dark-2);font-weight:500;font-size:.96rem;text-decoration:none;transition:color .3s}
.nav a:hover,.nav a.on{color:#fff}
.nav-ind{position:absolute;left:0;top:0;height:38px;width:0;border-radius:999px;background:rgba(255,255,255,.13);opacity:0;pointer-events:none;transition:transform .45s var(--ease),width .45s var(--ease),opacity .3s}
.hdr-cta{display:flex;align-items:center;gap:8px;margin-left:auto}
.burger{display:none;place-content:center;gap:5px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);cursor:pointer}
.burger i{display:block;width:18px;height:2px;border-radius:2px;background:#fff;transition:transform .45s var(--ease)}
.menu-open .burger i:first-child{transform:translateY(3.5px) rotate(45deg)}
.menu-open .burger i:last-child{transform:translateY(-3.5px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;padding:96px 0 0;background:var(--navy);visibility:hidden;clip-path:circle(0 at calc(100% - 52px) 46px);transition:clip-path .7s var(--ease),visibility 0s .7s}
.menu-open .menu{visibility:visible;clip-path:circle(170% at calc(100% - 52px) 46px);transition:clip-path .9s var(--ease),visibility 0s}
.menu a{display:block;padding:13px 0;border-bottom:1px solid var(--dark-line);font:640 clamp(1.7rem,7vw,2.7rem)/1.1 var(--display);font-stretch:112%;letter-spacing:-.03em;text-decoration:none;transform:translateY(26px);transition:transform .8s var(--ease)}
.menu-open .menu a{transform:none}
.menu-in{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding:0 var(--gut) 40px}
.menu-in>*{flex:none}.menu-in>:first-child{margin-top:auto}.menu-in>:last-child{margin-bottom:auto}
@media (max-height:560px){.menu a{padding:8px 0;font-size:clamp(1.25rem,6.2vh,1.7rem)}}
@media (max-width:1099px){.nav,.hdr-cta .gh{display:none}.burger{display:grid}}
.hdr.tight .nav,.hdr.tight .hdr-cta .gh{display:none}.hdr.tight .burger{display:grid}
@media (max-width:479px){.hdr-cta .my{display:none}}

.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--grad);padding-bottom:var(--r-sheet)}
.hero-stage{position:relative;isolation:isolate}
.hero-in{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;min-height:max(clamp(540px,76vh,780px),min(66vw,1080px)*.6 + 96px);padding-block:clamp(104px,13vh,140px) clamp(44px,6vh,64px);transform:translate3d(0,calc(var(--p,0)*var(--hh,800px)*.22),0);opacity:calc(1 - var(--p,0)*1.4)}
.hero-copy{position:relative;z-index:1;display:grid;justify-items:start;gap:clamp(20px,2.4vw,30px);max-width:min(40rem,46%)}
.hero h1{font-size:var(--t-hero);font-weight:660;line-height:.94;letter-spacing:-.04em}
.hero h1 span{display:block}
.hero .lead{color:var(--on-dark-2);max-width:54ch}
.pill30{display:inline-flex;align-items:center;gap:12px;padding:6px 18px 6px 6px;border-radius:999px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);color:var(--on-dark-2);font-size:.93rem;line-height:1.3;text-decoration:none;transition:background .3s,color .3s}
.pill30:hover{background:rgba(255,255,255,.13);color:#fff}
.pill30 b{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--cyan);color:var(--navy);font:800 .88rem/1 var(--display)}
@keyframes stagein{from{opacity:0}}

.film{position:absolute;right:0;bottom:0;z-index:0;display:block;width:min(66%,1080px);max-width:none;height:auto;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 20%,#000 31%);mask-image:linear-gradient(90deg,transparent 20%,#000 31%);animation:stagein 1.1s ease .1s both}
.film text{font-family:var(--body)}
.ldm{display:none}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.film :is(.reel,.actB,.vB,.vC,.b2,.selN,.ck,.ps,.seal,.sl,.badgeA,.tickA,.tickB,.ripA,.ripB,.ripC,.chand,.open,.okB,.rdy,.shop,.clk){opacity:0}
.film .runB{opacity:.4}
.film .cone{opacity:.3}
.type{animation:type .5s steps(2) infinite alternate}
@keyframes type{to{transform:translateY(-3px)}}
.brands-w{position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.18)}
.brands{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:28px;padding-block:20px;color:#fff;font-size:.93rem;line-height:1.35}
.brands>p{max-width:23ch}
.marq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq-track{display:flex;width:max-content;animation:marq 52s linear infinite}
.marq:hover .marq-track{animation-play-state:paused}
.marq-track span{display:flex;align-items:center;gap:clamp(28px,3.4vw,52px);padding-left:clamp(28px,3.4vw,52px);font:620 clamp(1.05rem,.9rem + .6vw,1.45rem)/1 var(--display);font-stretch:112%;letter-spacing:-.015em;color:#fff;white-space:nowrap}
.marq-track span::after{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--cyan)}
@keyframes marq{to{transform:translateX(-50%)}}

.sheet{position:relative;z-index:2;margin-top:calc(var(--r-sheet)*-1);padding-bottom:var(--inset);border-radius:var(--r-sheet);background:var(--paper);box-shadow:0 -26px 60px rgba(2,8,22,.5)}
.panel{position:relative;isolation:isolate;overflow:hidden;margin-inline:var(--inset);border-radius:var(--r-sheet);background:var(--sheet)}
.panel+.panel{margin-top:var(--inset)}
.panel.ink{background:var(--navy)}
.panel.grad{background:var(--grad);--on-dark-2:#fff;--on-dark-3:#fff}

.filter{display:grid;gap:14px;margin-bottom:22px}
.filter>p:first-child{font-weight:600}
.roles{display:flex;flex-wrap:wrap;gap:8px}
.role{height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);font-weight:500;font-size:.95rem;cursor:pointer;transition:background .3s,color .3s,box-shadow .3s}
.role:hover{box-shadow:inset 0 0 0 1.5px var(--aqua);color:var(--ink)}
.role[aria-pressed="true"]{background:var(--navy);box-shadow:none;color:#fff}
.role-note{min-height:1.6em;color:var(--muted)}
[hidden]{display:none!important}
.phero{position:relative;isolation:isolate;overflow:hidden;background:var(--grad);padding-bottom:var(--r-sheet);--on-dark-2:#fff}
.phero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:center;gap:clamp(28px,5vw,80px);padding-block:clamp(112px,14vh,148px) clamp(44px,6vh,72px)}
.phero-copy{display:grid;justify-items:start;gap:clamp(16px,2vw,24px)}
.phero h1{font-size:clamp(2.25rem,1.1rem + 2.9vw,3.6rem);font-weight:660;line-height:.98;letter-spacing:-.04em}
.phero .lead{color:var(--on-dark-2);max-width:48ch}
.crumb{display:flex;gap:10px;font-size:.95rem;color:var(--on-dark-2)}
.crumb a{color:var(--cyan);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.phero-art{border-radius:var(--r-panel);overflow:hidden;box-shadow:0 30px 70px -30px rgba(2,8,22,.8),inset 0 0 0 1px rgba(255,255,255,.12)}
.vrow{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);align-items:center;gap:clamp(28px,5vw,80px)}
.vrow>div{display:grid;gap:16px}
.vid{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:var(--r-panel);background:var(--navy);box-shadow:0 24px 60px -30px rgba(11,29,63,.6)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,24px)}
.fgrid li{padding:26px 24px 28px;border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.fgrid h3{font-size:var(--t-h3);margin-bottom:10px}
.fgrid p{color:var(--ink-2);font-size:.98rem}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start;gap:clamp(36px,6vw,104px)}
.two>div{display:grid;justify-items:start;gap:22px}
.btable{width:100%;border-collapse:collapse}
.btable th,.btable td{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.14);text-align:left;font-weight:500}
.btable th{font-size:.86rem;color:var(--on-dark-2)}
.btable th:last-child,.btable td:last-child{text-align:right;color:var(--on-dark-2)}
.vt,.nt b .vt{color:var(--viable-ink)}
.nt b .vt{display:inline;margin:0;max-width:none}
.dark .vt,.dark .nt b .vt{color:inherit}
.vrule::before,#page[data-pg="viable-test-kit"] .phero h1::before,#page[data-pg="viable-test-kit"] .facts::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--viable)}
.vrule::before{margin-bottom:14px}
.dgrid .vrule{position:relative}
.dgrid .vrule::before{position:absolute;left:0;top:-13px;margin:0}
#page[data-pg="viable-test-kit"] .phero h1::before{width:44px;height:5px;margin-bottom:clamp(14px,1.6vw,22px)}
#page[data-pg="viable-test-kit"] .facts::before{margin:20px 0 4px}
.reach{justify-self:end;width:min(100%,470px);padding:clamp(20px,2.4vw,30px) clamp(20px,2.6vw,34px) clamp(8px,1vw,14px);border-radius:var(--r-panel);background:rgba(14,42,82,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 30px 70px -34px rgba(2,8,22,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.reach h2{margin-bottom:clamp(12px,1.4vw,18px);font-size:var(--t-h3);letter-spacing:-.02em}
.reach dl>div{display:grid;grid-template-columns:4.6rem minmax(0,1fr);align-items:baseline;gap:16px;padding:15px 0;border-top:1px solid rgba(255,255,255,.16)}
.reach dt{font-size:.95rem}
.reach dd{font-weight:600;overflow-wrap:anywhere}
.reach a{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.5)}
.reach a:hover{text-decoration-color:#fff}
.ways>li{gap:16px;align-content:stretch;grid-template-rows:auto auto 1fr auto}
.ticks.sm{gap:11px;align-content:start}
.ticks.sm li{align-items:flex-start;gap:12px;font-size:.98rem;color:var(--ink)}
.ticks.sm svg{width:18px;height:18px;margin-top:3px}
.vpanel{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:start;gap:clamp(22px,5vw,80px);margin-top:clamp(14px,1.6vw,24px);padding:clamp(22px,3vw,40px) clamp(22px,3vw,44px);border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.vpanel h2{font-size:clamp(1.5rem,1.2rem + 1.2vw,2.2rem)}
.vpanel p{margin-top:12px;max-width:36ch;color:var(--ink-2)}
.vpanel .cases{margin-top:0}
.two.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.two.even .ticks{margin-block:clamp(22px,2.6vw,32px)}
.two.even .cases{margin-top:0}
.actions.after{margin-top:clamp(24px,3vw,40px)}
@media (max-width:959px){.reach{justify-self:stretch;width:100%}.vpanel,.two.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:599px){.fgrid.c4{grid-template-columns:minmax(0,1fr)}}
@media (max-width:419px){.reach dl>div{grid-template-columns:minmax(0,1fr);gap:3px;padding:12px 0}.reach dt{font-size:.88rem}}
.bnote{margin-top:18px;max-width:46ch;color:var(--on-dark-2);font-size:.96rem;line-height:1.5}
.ticks{display:grid;gap:14px;width:100%}
.ticks li{display:flex;align-items:center;gap:14px;font-weight:500}
.ticks svg{flex:none;width:20px;height:20px}
@media (max-width:959px){.phero-in,.vrow,.two{grid-template-columns:minmax(0,1fr)}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

#page .sec{padding-block:clamp(44px,5vw,72px)}
#page .sheet>.sec+.sec{padding-top:0}
#page .sheet>.sec:first-child{padding-top:clamp(44px,5vw,72px)}
#page .sec-head{margin-bottom:clamp(24px,3.4vw,44px)}
.phero.plain .phero-in{grid-template-columns:minmax(0,1fr);padding-bottom:clamp(36px,5vh,60px)}
.phero.plain h1{max-width:20ch}
.phero.plain .lead{max-width:62ch}
.phero h1:focus,.hero h1:focus,[id^="home-"]:focus{outline:none}
.body{color:var(--ink-2);max-width:64ch}
.lk{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.facts{width:100%;padding:8px clamp(20px,2.4vw,32px);border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.facts div{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.facts div:last-child{border:0}
.facts dt{color:var(--muted);font-size:.95rem}
.facts dd{font-weight:600}
.two>.cases,.two>.faqs,.two>.dgrid,.two>.form{align-self:start}
.two .cases{width:100%;margin-top:6px}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.num{counter-reset:n}
.fgrid.num li{counter-increment:n}
.fgrid.num li::before{content:counter(n);display:grid;place-items:center;width:32px;height:32px;margin-bottom:18px;border-radius:50%;background:var(--navy);color:#fff;font:600 .9rem/1 var(--body)}
.fgrid .big{font:660 clamp(2.2rem,1.5rem + 2.4vw,3.6rem)/1 var(--display);font-stretch:112%;letter-spacing:-.035em;color:var(--ink);margin-bottom:10px}
.q{font:580 1.14rem/1.35 var(--display);font-stretch:106%;letter-spacing:-.016em}
.dgrid{display:grid;gap:clamp(14px,1.6vw,24px);width:100%}
.dgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dgrid>li{display:grid;align-content:start;justify-items:start;gap:14px;padding:clamp(22px,2.6vw,34px);border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.dgrid h3{font-size:var(--t-h3)}
.dgrid p{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips li{padding:7px 14px;border-radius:999px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);font-weight:500;font-size:.93rem}
.dgrid .chips li{background:var(--paper)}
.dark .chips li{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.bgroup{display:grid;gap:14px}
.bgroup+.bgroup{margin-top:28px}
.bgroup h3{font:600 .95rem/1.3 var(--body);font-stretch:100%;letter-spacing:0;color:var(--muted)}
.dark .bgroup h3{color:var(--on-dark-2)}
.ticks.c2{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.callout{padding-bottom:clamp(14px,1.6vw,24px)}
.callout .world{margin-top:0}
.sec+.callout{margin-top:calc(clamp(44px,5vw,72px)*-.45)}
.callout+.sec{padding-top:clamp(32px,4vw,56px)!important}
.two>.faqs{display:block;justify-items:normal;width:100%;border-top:1px solid var(--line)}
.faq{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:18px 0;cursor:pointer;list-style:none;font:620 1.1rem/1.35 var(--display);font-stretch:108%;letter-spacing:-.015em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font:400 1.5rem/1 var(--body);color:var(--muted)}
.faq[open] summary::after{content:"\2212"}
.faq div{display:grid;gap:10px;padding:0 0 22px;max-width:66ch;color:var(--ink-2)}
.osteps{display:grid;gap:12px;counter-reset:o}
.osteps li{counter-increment:o;display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;color:var(--ink-2)}
.osteps li::before{content:counter(o);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font:600 .82rem/1 var(--body);color:var(--ink)}
.form{display:grid;gap:20px;width:100%}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.form label,.form legend{display:block;margin-bottom:8px;padding:0;font-weight:600;font-size:.96rem}
.form input:not([type=radio]),.form select,.form textarea{display:block;width:100%;min-height:52px;padding:12px 16px;border:0;border-radius:14px;background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--field);font:inherit;color:var(--ink)}
.form textarea{min-height:150px;resize:vertical}
.form fieldset{margin:0;padding:0;border:0;min-width:0}
.yn{display:flex;gap:24px}
.yn label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500}
.yn input{width:20px;height:20px;accent-color:var(--navy)}
.fmsg{padding:16px 18px;border-radius:14px;background:var(--wash);font-weight:500}
.nlist li[hidden]{display:none}
@media (max-width:959px){.fgrid.c3,.dgrid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid.c2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:599px){.fgrid,.fgrid.c3,.fgrid.c2,.dgrid.c3,.ticks.c2,.frow{grid-template-columns:minmax(0,1fr)}.facts div{grid-template-columns:minmax(0,1fr);gap:4px}}
@media (max-width:599px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.6vw,24px);margin-bottom:clamp(28px,3.4vw,44px)}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;text-decoration:none;transition:box-shadow .35s}
.pcard.off{display:none}
.pcard:hover,.pcard:focus-visible{box-shadow:inset 0 0 0 1.5px var(--aqua),0 22px 44px -26px rgba(11,29,63,.5)}
.pscene{display:block;aspect-ratio:16/10;background:var(--grad)}
.pscene svg{display:block;width:100%;height:100%}
.pscene text{font-family:var(--body)}
.pcard .grp{margin:20px 24px 0;font-size:.86rem;color:var(--muted)}
.pcard h3{margin:6px 24px 0;font-size:var(--t-h3);letter-spacing:-.02em}
.pcard p{margin:10px 84px 26px 24px;color:var(--ink-2);font-size:.98rem;transition:opacity .18s}
.pcard p.sw{opacity:0}
.pcard .go{position:absolute;right:18px;bottom:18px;width:46px;height:46px}
.pcard .pscene{position:relative;aspect-ratio:16/9;overflow:hidden}
.pcard .pscene svg{position:absolute;left:0;top:50%;height:auto;transform:translateY(-50%)}
@media (max-width:959px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:599px){
  .pcards{grid-template-columns:minmax(0,1fr);gap:10px}
  .pcard{display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:14px;padding:12px 14px 14px 12px}
  .pcard .pscene{grid-row:1/4;align-self:start;width:104px;aspect-ratio:16/10;border-radius:10px}
  .pcard .grp{margin:1px 0 0;font-size:.8rem}
  .pcard h3{margin:3px 0 0;font-size:1.06rem}
  .pcard p{margin:6px 0 0;font-size:.92rem;line-height:1.45}
  .pcard .go{display:none}
  .roles{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--gut)*-1);padding:6px var(--gut);scroll-padding-inline:var(--gut);scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--gut),#000 calc(100% - var(--gut)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--gut),#000 calc(100% - var(--gut)),transparent)}
  .roles::-webkit-scrollbar{display:none}
  .role{flex:none}
}

.dark .lead,.dark .sec-head p{color:var(--on-dark-2)}
.auto{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(36px,5.5vw,96px)}
.auto-copy{display:grid;justify-items:start;gap:22px}
.benefits{width:100%;border-top:1px solid var(--dark-line)}
.benefits li{display:grid;grid-template-columns:minmax(0,10.5rem) minmax(0,1fr);gap:6px 18px;padding:13px 0;border-bottom:1px solid var(--dark-line)}
.benefits b{font-weight:600}
.benefits span{color:var(--on-dark-2);font-size:.96rem}
.run{display:grid;gap:22px;padding:clamp(18px,2.6vw,34px);border-radius:var(--r-panel);background:rgba(98,213,232,.06);box-shadow:inset 0 0 0 1px var(--dark-line)}
.run-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;color:var(--on-dark-3);font-size:.95rem}
.run-top b{font:640 clamp(1.5rem,1.1rem + 1.5vw,2.4rem)/1 var(--display);font-stretch:112%;letter-spacing:-.03em;color:#fff;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:clamp(3px,.55vw,7px)}
.cells i{aspect-ratio:1;border-radius:24%;background:rgba(195,208,230,.11);transition:background .4s,transform .4s var(--ease),box-shadow .4s}
.cells i.r{background:var(--cyan);transform:scale(1.2);box-shadow:0 0 16px rgba(98,213,232,.75)}
.cells i.d{background:var(--aqua)}
.cells i.s{background:var(--pass)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:st;font-size:.9rem;line-height:1.35;color:var(--on-dark-2)}
.steps li{display:grid;gap:8px;align-content:start;counter-increment:st}
.steps li::before{content:counter(st);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--k);color:var(--navy);font:700 .78rem/1 var(--body)}
.run figcaption{font-size:.85rem;color:var(--on-dark-3)}

.svc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start;gap:clamp(40px,6vw,104px)}
.svc-copy{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:26px}
.phw{position:relative;width:100%;padding-top:54px;--ph:1}
.puck{position:absolute;left:calc(var(--ph)*80% + 5px);top:0;width:22px}
.puck svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 3px 5px rgba(11,29,63,.25))}
.puck .bdg{opacity:0;transition:opacity .3s}
.phw.cert .bdg{opacity:1}
.phases{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));width:100%;counter-reset:ph}
.phases::before,.phases::after{content:"";position:absolute;left:0;top:15px;width:80%;height:2px;background:var(--line)}
.phases::after{background:linear-gradient(90deg,var(--navy),var(--aqua));transform:scaleX(var(--ph));transform-origin:0 0}
.phases li{position:relative;z-index:1;counter-increment:ph;padding:46px 10px 0 0;font-weight:600;font-size:.95rem;line-height:1.3;color:var(--muted);transition:color .3s}
.phases li.on{color:var(--ink)}
.phases li::before{content:counter(ph);position:absolute;left:0;top:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 6px var(--paper),inset 0 0 0 1.5px #B9C6D8;color:var(--muted);font-size:.82rem;transition:background .3s,color .3s,box-shadow .3s,transform .4s var(--ease)}
.phases li.on::before{background:var(--navy);box-shadow:0 0 0 6px var(--paper);color:#fff;transform:scale(1.1)}
.phases li.on:nth-child(4)::before{background:var(--pass);color:var(--navy)}
.note{color:var(--muted);font-size:.96rem;max-width:60ch}
.vtx{margin-top:14px;max-width:60ch}.vtx summary{cursor:pointer;font-weight:600;color:var(--ink)}
.vtx ol{margin:12px 0 0;padding-left:1.3em;color:var(--ink-2);font-size:.96rem;line-height:1.5}.vtx li+li{margin-top:6px}
.sub{font-size:var(--t-h3);margin-bottom:16px}
.cases{border-top:1px solid var(--line)}
.case{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 16px;padding:17px 0;border-bottom:1px solid var(--line);text-decoration:none}
.case b{font:620 1.12rem/1.3 var(--display);font-stretch:108%;letter-spacing:-.015em}
.case span{grid-column:1;color:var(--muted);font-size:.94rem}
.case .ic{grid-area:1/2/3/3;color:var(--muted);transition:transform .4s var(--ease),color .3s}
.case:hover b{color:var(--aqua)}
.case:hover .ic{color:var(--aqua);transform:translate(3px,-3px)}

.qs{padding-top:0}
.qnav{display:flex;gap:8px}
.qnav button{display:grid;place-items:center;width:50px;height:50px;border:0;border-radius:50%;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .3s,color .3s}
.qnav button:hover{background:var(--navy);color:#fff}
.qstrip{--pad:max(var(--gut),calc((100% - var(--max))/2));display:flex;gap:18px;overflow-x:auto;padding:4px var(--pad) 8px;scroll-padding-inline:var(--pad);scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.qstrip::-webkit-scrollbar{display:none}
.qstrip.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.qcard{flex:0 0 min(400px,84%);display:grid;align-content:space-between;gap:18px;aspect-ratio:85.6/53.98;padding:clamp(20px,2.4vw,30px);border-radius:18px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line);scroll-snap-align:start}
.qcard:nth-child(3n+2){background:var(--grad);box-shadow:none;color:#fff}
.qcard svg{width:46px}
.qcard blockquote{font:580 clamp(1.08rem,1rem + .36vw,1.3rem)/1.3 var(--display);font-stretch:106%;letter-spacing:-.018em}

.y30{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,88px)}
.num30{width:100%;aspect-ratio:1.25}
.y30-copy{display:grid;justify-items:start;gap:20px}
.y30-copy p{color:var(--ink-2);max-width:58ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(40px,5vw,72px);border-top:1px solid var(--line)}
.stat{padding:26px 24px 0 0}
.stat+.stat{padding-left:clamp(14px,2vw,28px);border-left:1px solid var(--line)}
.stat dt{font:640 clamp(2rem,1.4rem + 1.9vw,3.3rem)/1 var(--display);font-stretch:112%;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stat dd{margin-top:10px;color:var(--muted);font-size:.95rem}
.band{padding-top:clamp(28px,3.6vw,52px)}
.band .stats{margin-top:0;padding:clamp(20px,2.4vw,30px) clamp(20px,2.6vw,34px) clamp(22px,2.6vw,32px);border:0;border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.band .stat{padding-top:0}

.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.pgrid li{border-bottom:1px solid var(--line)}
.pgrid li:not(:nth-child(3n+1)){border-left:1px solid var(--line)}
.pgrid a{display:grid;align-content:start;gap:12px;height:100%;padding:28px clamp(14px,2vw,28px) 34px;text-decoration:none;transition:background .35s}
.pgrid a:hover{background:var(--sheet)}
.pgrid h3{font-size:var(--t-h3)}
.pgrid p{color:var(--ink-2);font-size:.96rem}
.world{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px 32px;margin-top:clamp(28px,4vw,52px);padding:clamp(22px,3vw,38px);border-radius:var(--r-panel);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.world h3{font-size:var(--t-h3);margin-bottom:8px}
.world p{color:var(--ink-2);max-width:62ch}

.nlist{border-top:1px solid var(--line)}
.nrow{display:grid;grid-template-columns:9rem minmax(0,1fr) auto;align-items:center;gap:clamp(14px,3vw,44px);padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none}
.nt b{display:block;font:620 clamp(1.15rem,1rem + .6vw,1.5rem)/1.2 var(--display);font-stretch:108%;letter-spacing:-.022em}
.nt span{display:block;margin-top:6px;color:var(--ink-2);max-width:72ch}

.cgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start;gap:clamp(36px,6vw,104px)}
.cgrid>div{display:grid;justify-items:start;gap:22px}
.cgrid address{font-style:normal;line-height:1.7;color:var(--on-dark-2)}
.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:rgba(255,255,255,.5)}
.ul:hover{text-decoration-color:#fff}
.teams{border-top:1px solid rgba(255,255,255,.22)}
.teams li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 24px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,.22)}
.teams h3{font-size:var(--t-h3)}
.teams p{margin-top:4px;color:var(--on-dark-2);font-size:.95rem}
.tc{display:grid;justify-items:end;gap:4px;font-size:.96rem}
.tc span{font-weight:600}

.foot{position:relative;z-index:2;overflow:hidden;background:var(--navy);color:var(--on-dark-2)}
.foot-in{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(4,minmax(0,1fr));gap:clamp(24px,3vw,48px);padding-block:clamp(56px,7vw,100px) 44px}
.foot .brand img{height:52px}
.foot-tag{margin-top:20px;max-width:13ch;font:640 clamp(1.3rem,1.1rem + .8vw,1.85rem)/1.12 var(--display);font-stretch:112%;letter-spacing:-.025em;color:#fff}
.foot h3{margin-bottom:14px;font:600 .92rem/1.3 var(--body);letter-spacing:0;color:#fff}
.foot ul{display:grid;gap:10px;font-size:.95rem}
.foot a{text-decoration:none;transition:color .25s}
.foot ul a:hover,.foot-base a:hover{color:#fff}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-block:22px;border-top:1px solid var(--dark-line);font-size:.88rem}
.giant{width:100%;height:auto;padding-inline:var(--inset)}
.giant text{font:800 150px var(--display);font-stretch:118%;fill:none;stroke:rgba(98,213,232,.4);stroke-width:1px;vector-effect:non-scaling-stroke}

.js .rise{transition:transform 1.1s var(--ease) var(--d,0s)}
.js .rise:not(.in){transform:translateY(38px)}

@media (max-width:959px){
  .hero-in{min-height:0;padding-bottom:calc(73vw + 96px);transform:none;opacity:1}
  .hero-copy{max-width:none}
  .film{width:122%;bottom:68px}
  .auto,.svc,.y30,.cgrid{grid-template-columns:minmax(0,1fr)}
  .num30{max-width:520px}
  .foot-in{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot-in>div:first-child{grid-column:1/-1}
}
@media (max-width:899px){
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgrid li:not(:nth-child(3n+1)){border-left:0}
  .pgrid li:nth-child(even){border-left:1px solid var(--line)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){margin-top:26px;border-top:1px solid var(--line)}
  .band .stat:nth-child(n+3){padding-top:22px}
}
@media (max-width:759px){
  .sec-head.row,.world{grid-template-columns:minmax(0,1fr)}
  .brands{grid-template-columns:minmax(0,1fr);gap:12px}
  .brands>p{max-width:none}
  .nrow{grid-template-columns:minmax(0,1fr) auto;gap:10px 16px}
  .nrow .tag{grid-area:1/1}
  .nrow .nt{grid-area:2/1}
  .nrow .go{grid-area:1/2/3/3;width:44px;height:44px}
  .benefits li{grid-template-columns:minmax(0,1fr)}
  .teams li{grid-template-columns:minmax(0,1fr)}
  .tc{justify-items:start}
}
@media (max-width:559px){
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .pgrid li:nth-child(even){border-left:0}
  .phw{padding-top:0}
  .puck{display:none}
  .phases{grid-template-columns:minmax(0,1fr);gap:16px}
  .phases::before,.phases::after{left:15px;top:0;width:2px;height:calc(100% - 32px)}
  .phases::after{background:linear-gradient(var(--navy),var(--aqua));transform:scaleY(var(--ph))}
  .phases li{padding:5px 0 5px 50px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .steps li{grid-template-columns:24px minmax(0,1fr);align-items:center;gap:12px}
  .cells{grid-template-columns:repeat(12,minmax(0,1fr))}
  .foot-in{grid-template-columns:minmax(0,1fr)}
}
.still .marq-track{animation-play-state:paused}
.rest .film{animation:none}
.hero-ctl{position:absolute;left:0;right:0;bottom:14px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:clamp(.78rem,1.05vw,.9rem);pointer-events:none}
.hero-ctl>*{pointer-events:auto}
.ctl{display:flex;align-items:center;gap:.8em;padding:.4em 1.3em .4em .4em;border-radius:999px;background:rgba(14,42,82,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14)}

.fx-x{display:grid;place-items:center;flex:none;width:44px;height:100%;margin-left:auto;border:0;background:none}
.fx-x .ti path{stroke:#fff}
.fx-x:hover{background:#c42b1c}
.fx-nav{display:flex;align-items:center;gap:12px;padding:4px 12px 8px}
.fi{flex:none;width:16px;height:16px;color:#d6d6d6}
.fi.dim{color:#6a6a6a}.fi.sm{width:12px;height:12px}.fi.g{color:#3fb950}
.fx-addr{flex:1;display:flex;align-items:center;gap:6px;min-width:0;height:30px;padding:0 8px;border-radius:4px;background:#2c2c2c;font-size:12px;white-space:nowrap}
.fx-addr .end{margin-left:auto}
.fx-search{flex:0 1 210px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;height:30px;padding:0 10px;border-radius:4px;background:#2c2c2c;
  color:#9e9e9e;font-size:12px;white-space:nowrap;overflow:hidden}
.fx-cmd{display:flex;align-items:center;gap:22px;height:36px;padding:0 16px;border-top:1px solid #2e2e2e;font-size:12px;white-space:nowrap}
.fx-cmd>span{display:inline-flex;align-items:center;gap:5px}
.fx-cmd .fx-r{gap:10px;margin-left:auto}
.fx-r i{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#2f86e0;font-size:11px;font-style:normal;font-weight:700}
.fx-body{display:grid;grid-template-columns:160px minmax(0,1fr) 190px;min-height:0;border-top:1px solid #2e2e2e}
.fx-side{margin:0;padding:6px 4px;list-style:none;overflow:hidden;font-size:12px}
.fx-side li{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:4px;white-space:nowrap}
.fx-side li.on{background:#2d2d2d}
.fx-side li.sep{height:1px;margin:6px 10px;padding:0;background:#333}
.fx-side svg{flex:none;width:16px;height:16px}
.fx-files{padding:8px 16px;background:#1a1a1a;overflow:auto}
.fx-grp{display:flex;align-items:center;gap:7px;margin-bottom:8px!important;font-size:13px}
.fx-f{display:grid;justify-items:center;gap:6px;width:150px;padding:10px 8px 9px;border:1px solid transparent;border-radius:4px;background:none;color:#fff;
  font-size:11.5px;line-height:1.3;text-align:center;overflow-wrap:anywhere}
.fx-f:hover{background:#2b2b2b}
.fx-f[aria-pressed="true"]{background:#2f4258;border-color:#5a8fc9}
.fx-doc{width:64px;height:80px}
.fx-prev{display:grid;place-items:center;padding:12px;border-left:1px solid #2e2e2e;background:#1a1a1a;color:#d2d2d2;font-size:12px;text-align:center}
.fx-foot{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,210px);align-items:center;gap:10px;padding:10px 16px 14px;border-top:1px solid #2e2e2e;font-size:12px}
.fx-in,.fx-type{height:30px;padding:0 9px;border:1px solid #3c3c3c;border-bottom-color:#8f8f8f;border-radius:4px;background:#2c2c2c;white-space:nowrap;overflow:hidden}
.fx-in{display:block;line-height:28px;text-overflow:ellipsis}
.fx-type{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fx-btns{grid-column:2/-1;justify-self:end;display:flex;gap:8px}
.fx-b{min-width:96px;height:32px;padding:0 16px;border:1px solid #474747;border-radius:4px;background:#2d2d2d;color:#fff}
.fx-b:not(:disabled):hover{background:#383838}
.fx-b:disabled{border-color:#383838;color:#767676}

.dl-suites{--w:720px}
.dlg-bar.pink{background:linear-gradient(90deg,#fff 30%,#fdebf0)}
.dlg-x.red{flex:none;width:20px;height:20px;margin-right:6px;border-radius:2px;background:#d9363e}
.dlg-x.red .ti{width:14px;height:14px}
.dlg-x.red .ti path{stroke:#fff}
.dlg-x.red:hover{background:#b3262b}
.su{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.6fr);height:400px;background:#f0f0f0}
.su-c{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;border-right:1px solid #a0a0a0}
.su-c:last-child{border-right:0}
.su h4{padding:4px 6px;border-bottom:1px solid #cfcfcf;font-size:12px;font-weight:400}
.su-bl{display:grid;align-content:start;padding:5px 7px}
.su-brand{min-height:56px;margin-top:-1px;border:1px solid #9a9a9a;background:linear-gradient(#f9f9f9,#e7e7e7);font-size:13px;font-weight:700}
.su-brand:first-child{margin-top:0}
.su-brand:hover,.su-brand[aria-pressed="true"]{position:relative;border-color:#3c7fb1}
.su-brand:hover{background:linear-gradient(#eef7fe,#d4eafa)}
.su-brand[aria-pressed="true"]{background:#cce4f7}
.su-list{overflow:auto;background:#fff}
.su-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:11px 14px 12px;border:0;border-bottom:1px solid #e3e3e3;
  background:#fff;text-align:left}
.su-item:hover{background:#e5f1fb}
.su-kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:9px 12px;align-items:baseline}
.su-f{grid-column:1/-1}
.su-tag{align-self:start;padding:3px 7px;border:1px solid #c8c8c8;border-radius:3px;color:#4d4d4d;font-size:10.5px;font-weight:600;white-space:nowrap}
@container app (max-width:700px){
  .fx-body{grid-template-columns:130px minmax(0,1fr)}
  .fx-prev,.fx-search{display:none}
}
@container app (max-width:520px){
  .fx-side,.fx-cmd>span:nth-child(2),.fx-cmd .fx-r{display:none}
  .fx-body{grid-template-columns:minmax(0,1fr)}
  .fx-nav{gap:9px}
  .fx-foot{grid-template-columns:auto minmax(0,1fr)}
  .fx-type,.fx-btns{grid-column:1/-1}
  .su{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:450px}
  .su-c{border-right:0}
  .su-c:first-child{border-bottom:1px solid #a0a0a0}
  .su-bl{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .su-brand{min-height:36px;margin-top:0}
  .su-tag{display:none}
}
.ap-pop{position:absolute;z-index:30}
.ap-pop[hidden]{display:none}
.pop{display:grid;min-width:210px;padding:3px;background:#fff;border:1px solid #bdbdbd;box-shadow:0 8px 22px -8px rgba(0,0,0,.4)}
.pop button{padding:4px 20px 4px 24px;border:0;background:none;text-align:left;white-space:nowrap}
.pop button:hover,.pop button:focus{background:#e5f1fb;outline:0}
.pop button:disabled{color:#a3a3a3;background:none}
.pop hr{margin:3px 4px;border:0;border-top:1px solid #e0e0e0}
.ap-toast{position:absolute;left:50%;bottom:32px;z-index:40;max-width:min(88%,440px);padding:8px 12px;border-radius:6px;background:#262626;color:#fff;font-size:12px;
  line-height:1.4;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,6px);transition:opacity .2s,transform .2s}
.ap-toast.on{opacity:1;transform:translate(-50%,0)}

@container app (max-width:700px){
  .ts{grid-template-columns:minmax(0,1fr)}
  .tp,.c-card{display:none}
  .tt{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"cur cur" "ctl arv" "tx tx" "side side" "plan plan"}
  .ct-grid,.qa,.an-cols{grid-template-columns:minmax(0,1fr)}
  .pj-sum{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@container app (max-width:520px){
  .c-an{display:none}
  .tb:not(.keep)>span{display:none}
  .ap-status>span:nth-child(2),.ap-status>span:nth-child(3){display:none}
  .tt{grid-template-columns:minmax(0,1fr);grid-template-areas:"cur" "ctl" "arv" "tx" "side" "plan"}
  .ct-btns,.dv-g{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:599px){.app{height:600px}}

.desk{container-type:inline-size;border-radius:24px;padding:clamp(10px,1.4vw,16px);background:linear-gradient(160deg,#DCE7F1,#C9D8E6);box-shadow:inset 0 0 0 1px rgba(14,42,82,.08)}
.desk-s{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) 37cqw;column-gap:9cqw;
  align-items:start;padding:14cqw 6cqw 20cqw;border-radius:18px;background:radial-gradient(120% 90% at 30% 0%,#F7FAFD,#E8EFF6 70%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(14,42,82,.06);overflow:hidden;touch-action:pan-y}
.desk-cable{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
.reader{position:relative;z-index:1;justify-self:center;width:33cqw;margin-top:9cqw;aspect-ratio:.8;border-radius:4.2cqw;
  background:linear-gradient(165deg,#FFFFFF 30%,#E2E7ED);box-shadow:0 2.4cqw 4cqw -1.6cqw rgba(14,42,82,.42),inset 0 0 0 .3cqw rgba(14,42,82,.09),inset 0 -.9cqw 1.4cqw rgba(14,42,82,.06)}
.rd-pad{position:absolute;inset:14% 12% 16%;display:grid;place-items:center;border-radius:2.8cqw;background:linear-gradient(165deg,#F4F7FA,#E1E6EC);
  box-shadow:inset 0 0 0 .3cqw rgba(14,42,82,.07);color:#9DABBD;transition:box-shadow .25s}
.rd-pad svg,.tm-cl svg{width:42%;height:auto}
.rd-led{position:absolute;top:4.2%;right:9%;width:1.9cqw;height:1.9cqw;border-radius:50%;background:#CDD5DE;box-shadow:inset 0 0 0 .3cqw rgba(14,42,82,.14)}
.rd-led[data-s="on"]{background:#3CCB98;box-shadow:0 0 1.6cqw rgba(60,203,152,.9)}
.rd-led[data-s="busy"]{background:#3CCB98;animation:blink .5s steps(2) infinite}
.rd-slot{position:absolute;left:18%;right:18%;bottom:-.3cqw;height:1.2cqw;border-radius:.6cqw;background:#5C6779}
.term{position:relative;z-index:3;display:grid;gap:2.4cqw;padding:2.4cqw 2.6cqw 3.6cqw;border-radius:5cqw 5cqw 6cqw 6cqw;
  background:linear-gradient(170deg,#2E394C,#1A212E);box-shadow:0 3cqw 5cqw -2cqw rgba(14,42,82,.6),inset 0 0 0 .35cqw rgba(255,255,255,.06)}
.tm-head{position:relative;display:grid;place-items:center;height:17cqw;border-radius:3cqw;color:#7F93B0;transition:box-shadow .25s}
.tm-leds{position:absolute;top:1.6cqw;left:50%;display:flex;gap:1.6cqw;transform:translateX(-50%)}
.tm-leds i{width:1.7cqw;height:1.7cqw;border-radius:50%;background:#3A4456}
.tm-leds i.on{background:#3CCB98;box-shadow:0 0 1.4cqw rgba(60,203,152,.95)}
.tm-cl{display:grid;place-items:center;width:100%;height:100%;padding-top:2.6cqw}
.tm-screen{display:grid;place-content:center;justify-items:center;gap:.6cqw;height:19cqw;padding:0 2cqw;border-radius:2cqw;
  background:linear-gradient(170deg,#E7F1F2,#CFE0E3);color:#12202E;text-align:center;box-shadow:inset 0 .5cqw 1.2cqw rgba(0,0,0,.18)}
.tm-a{font:600 2.5cqw/1.1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:#43566B}
.tm-b{font:700 4.6cqw/1.05 var(--body);letter-spacing:-.01em}
.tm-c{min-height:2.6cqw;font:600 2.6cqw/1.1 var(--body);color:#2D4155}
.tm-screen.ok .tm-b{color:#0B6B47}
.tm-screen.bad .tm-b{color:#B0202E}
.tm-screen.pin .tm-c{font-size:3.4cqw;letter-spacing:.3em}
.tm-screen.busy .tm-c::after{content:"";display:inline-block;width:1.6cqw;height:1.6cqw;margin-left:1cqw;border-radius:50%;
  border:.4cqw solid #2D4155;border-right-color:transparent;vertical-align:-.2cqw;animation:spin .8s linear infinite}
.tm-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3cqw}
.tm-keys button{height:4.9cqw;min-height:0;padding:0;border:0;border-radius:1.3cqw;background:linear-gradient(#4A5568,#394355);color:#fff;
  font:600 2.6cqw/1 var(--body);box-shadow:0 .5cqw 0 #1F2632;cursor:pointer}
.tm-keys button:disabled{cursor:default}
.tm-keys button:not(:disabled):active{transform:translateY(.4cqw);box-shadow:0 .1cqw 0 #1F2632}
.tm-keys .k0{grid-column:2}
.tm-keys .kx{grid-column:1}
.tm-keys .kx{background:linear-gradient(#E05A5A,#C23C3C)}
.tm-keys .kc{background:linear-gradient(#EFC24E,#D9A72C);color:#3A2B05}
.tm-keys .ko{background:linear-gradient(#3DBE87,#25996A)}
.tm-keys svg{width:2.8cqw;height:2.8cqw}
.tm-slot{position:absolute;left:20%;right:20%;bottom:-.35cqw;height:1.3cqw;border-radius:.65cqw;background:#0B0F16}
.card{position:absolute;left:0;top:0;z-index:6;width:20cqw;height:31cqw;min-height:0;padding:0;border:0;border-radius:1.3cqw;overflow:hidden;
  background:#123;box-shadow:0 1.2cqw 2.4cqw -1cqw rgba(14,42,82,.65);cursor:grab;touch-action:none;
  transition:transform .5s var(--ease),box-shadow .3s}
.card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;-webkit-user-drag:none}
.card.lift{box-shadow:0 4cqw 6cqw -2cqw rgba(14,42,82,.7)}
.card.under{z-index:2}
.card.drag{z-index:10;cursor:grabbing;transition:box-shadow .3s;box-shadow:0 5cqw 7cqw -2cqw rgba(14,42,82,.7)}
.card.noanim{transition:none}
.card.nope{animation:nope .4s}
.card:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
.rd-pad.hint,.tm-head.hint{box-shadow:0 0 0 .6cqw rgba(98,213,232,.55),0 0 0 1.6cqw rgba(98,213,232,.18);animation:hint 1.6s ease-in-out infinite}
.tm-slot.hint{background:#62D5E8;box-shadow:0 0 0 .8cqw rgba(98,213,232,.35);animation:hint 1.6s ease-in-out infinite}
.rd-pad.hot,.tm-head.hot{box-shadow:0 0 0 .8cqw var(--cyan)!important;animation:none}
.tm-slot.hot{background:var(--cyan);box-shadow:0 0 0 1cqw rgba(98,213,232,.5)!important;animation:none}
.desk-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.desk-ctl button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:6px 10px;border:0;border-radius:12px;
  background:rgba(255,255,255,.72);color:var(--ink);font:600 .85rem/1.2 var(--body);text-align:center;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(14,42,82,.1);transition:background .2s,box-shadow .2s}
.desk-ctl button:hover{background:#fff}
.desk-ctl button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:none}
.desk-ctl button.next:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--aqua);background:#fff}
.desk-ctl .ic{flex:none;width:18px;height:18px}
.desk-note{margin-top:10px;color:var(--ink-2);font-size:.85rem;text-align:center}
.desk-msg{display:none}
.pinpad{display:none}
@media (max-width:1099px){
  .desk-msg:not(:empty){display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.8);
    color:var(--ink);font:600 .92rem/1.4 var(--body)}
  .desk-msg::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--aqua)}
  .desk-msg[data-tone="ok"]::before{background:var(--pass)}
  .desk-msg[data-tone="warn"]::before{background:#E8A21A}
  .desk-msg[data-tone="bad"]::before{background:var(--red)}
}
@media (max-width:759px){
  .pinpad:not([hidden]){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .pinpad button{min-height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:600 1.1rem/1 var(--body)}
  .pinpad .k0{grid-column:2}
  .pinpad .kx{grid-column:1;background:#C23C3C;font-size:.95rem}
  .pinpad .kc{background:#D9A72C;color:#3A2B05;font-size:.95rem}
  .pinpad .ko{background:#25996A;font-size:.95rem}
}
@keyframes blink{50%{background:#2B3442;box-shadow:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes hint{50%{box-shadow:0 0 0 .6cqw rgba(98,213,232,.25),0 0 0 2.4cqw rgba(98,213,232,0)}}
@keyframes nope{25%{translate:-1.2cqw 0}75%{translate:1.2cqw 0}}
@media (max-width:479px){.desk-ctl{grid-template-columns:minmax(0,1fr)}.desk-ctl button{justify-content:flex-start;padding-inline:14px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.rd-pad.hint,.tm-head.hint,.tm-slot.hint,.rd-led[data-s="busy"]{animation:none}}

.tw-wrap{overflow-x:auto}

.ty-test{display:grid;gap:4px;font:640 1.2rem/1.3 var(--display);font-stretch:106%}
.ty-test span{color:var(--muted);font:600 .74rem/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase}

  if(st.at!=='reader')moveTo('reader');led('on');toScreen('login');hints()}

function act(a,b,e){switch(a){
  case 'menu':return openMenu(b);
  case 'login':b.disabled=true;b.classList.add('busy');return later(700,()=>toScreen('licence'));
  case 'licence':return toScreen('tasks');
  case 'logout':return toScreen('login');
  case 'dlg-x':if(DLG?.kind==='licence')return toScreen('login');if(DLG?.kind==='device'){closeDlg();st.ph='idle';A.queue=[];render();return guide()}
    if(DLG?.kind==='suites'){closeDlg();return guide()}return closeDlg();
  case 'tse-file':return openFileDlg();
  case 'f-pick':pickFile();if(e&&e.detail===0)openSuites();return;
  case 'f-open':return openSuites();
  case 'f-cancel':closeDlg();return guide();
  case 'brand':return chooseBrand(b.dataset.b);
  case 'suite':return openProject(makeProject(brandOf(A.brand),+b.dataset.s));
  case 'recent':return openProject(RECENT[+b.dataset.r]);
  case 'na':return toast(b.dataset.na||NA.def);
  case 'tab':A.tab=b.dataset.tab;return render();
  case 'filter':A.filter=b.dataset.f;return render();
  case 'refresh':render();return toast('The test list is up to date.');
  case 'row':A.sel=+b.dataset.i;return render();
  case 'run':return runTests([A.sel]);
  case 'runc':return runTests([...A.chk].sort((x,y)=>x-y));
  case 'selall':A.chk=new Set(tests().map((t,i)=>i));return render();
  case 'seluntested':A.chk=new Set(tests().map((t,i)=>i).filter(i=>!A.res[i]));return render();
  case 'selnone':A.chk=new Set();return render();
  case 'viewlog':A.tab='analysis';return render();
  case 'first':case 'prev':case 'next':case 'last':{const L=logs();if(!L.length)return;let k=L.indexOf(A.sel);
    k=a==='first'?0:a==='last'?L.length-1:k<0?0:Math.max(0,Math.min(L.length-1,k+(a==='next'?1:-1)));A.sel=L[k];if(A.tab!=='scripts')A.tab='analysis';return render()}
  case 'an':case 'anh':return toast('Analysed again: the log gives the same result.');
  case 'calc':dlg('calc',calcDlg(),{esc:true});return calc();
  case 'logs':return toast('On your PC, this opens the project’s log folder in Windows Explorer.');
  case 'plans':return toast('On your PC, this opens the test plan folder in Windows Explorer.');
  case 'help':case 'about':return dlg('about',aboutDlg(),{esc:true});
  case 'newp':if(!free())return toast('Stop the test first.');return openFileDlg();
  case 'open':if(!free())return toast('Stop the test first.');if(main())return toScreen('tasks');
    return toast('Open a project under Most Recent Projects, or click Project from TSE File.');
  case 'close':if(!free())return toast('Stop the test first.');if(!main())return toast('No project is open.');return toScreen('tasks');
  case 'exit':return restart();
  case 'reader':return dlg('reader',readerDlg(),{esc:true});
  case 'rdr-ok':{const v=$('#ap-layer input[name="rdr"]:checked');if(v)A.reader=v.value;closeDlg();
    return toast(A.reader==='CL'?'ICCSimTMat uses the reader’s contactless side (CL), where the card sits.':'ICCSimTMat uses the reader’s contact side.')}
  case 'version':return toast('Card version: ICC Demo applet 1.0. It matches the test plan.');
  case 'device':return chooseDevice(b.dataset.d);
  case 'card-yes':return cardYes();
  case 'card-again':return dlg('card',cardDlg());
  case 'card-stop':return abort('Card not found: choose the CL reader in Tools › Manual Testing: Select Mandatory Reader, then run the test again.');
  case 'card-no':return abort('No card, so the test run stopped.');
  case 'stop':return abort();
  case 'q-save':return save();
  case 'ok':return closeDlg();
}}

function moved(from,to){
  if(from==='reader'){led('off');
    if(st.ph==='loading'){stop();bar(0);st.ph='card';ts({prompt:'Waiting for card',pk:'blue',action:'Script download failed',result:'Card removed from the reader',advice:'Put the card back and click Yes'});
      dlg('card',cardDlg());coach('The card left the reader while the script was loading. Put it back on the reader and click Yes.','warn');hints();return}
    if(st.ph==='logread'){stop();bar(0);st.ph='paid';ts({prompt:'Waiting for log',pk:'blue',action:'Wait for log on card',result:'Failed to power on smartcard',advice:'Put the card back on the reader'});
      coach('Failed to power on smartcard: the card left the reader too soon. Put it back and keep it there until the log has been read.','warn');hints();return}}
  if(from==='slot'&&['reading','processing','pin'].includes(st.ph)){stop();st.removed=true;keys(false);finish('Cancelled');screen('Purchase','Card removed','Cancelled','bad');if(to==='reader')return}
  if(to==='reader'){led('on');if(st.ph==='paid'){readLog();return}
    if(st.ph==='card')coach('The card is on the reader: click Yes to load the test onto it.');hints();return}
  if(st.ph==='present'){payment(to);return}
  if(['idle','device','card','loading','between'].includes(st.ph)){notReady();hints();return}
  hints()}

function hints(){const want=st.ph==='present'?T().iface:{card:'reader',loading:'reader',paid:'reader',logread:'reader'}[st.ph];
  pad.classList.toggle('hint',want==='reader'&&st.at!=='reader');head.classList.toggle('hint',want==='tap'&&st.at!=='tap');slot.classList.toggle('hint',want==='slot'&&st.at!=='slot');
  $$('.desk-ctl button').forEach(b=>{b.classList.toggle('next',b.dataset.to===want&&st.at!==want);b.setAttribute('aria-pressed',b.dataset.to===st.at)});
  card.setAttribute('aria-label',`ICC test card, ${{reader:'on the reader',tap:'held to the terminal',slot:'in the terminal'}[st.at]}. Drag it, or use the buttons under the desk.`)}
function anchor(at){const d=desk.getBoundingClientRect(),cw=card.offsetWidth,ch=card.offsetHeight;
  if(at==='reader'){const r=pad.getBoundingClientRect();return [r.left-d.left+r.width/2-cw/2,r.top-d.top+r.height/2-ch/2,0]}
  const t=term.getBoundingClientRect(),h=head.getBoundingClientRect();
  if(at==='tap')return [t.left-d.left+t.width/2-cw/2+cw*.06,h.top-d.top+h.height*.28-ch/2,-9];
  return [t.left-d.left+t.width/2-cw/2,t.bottom-d.top-ch*.42,0]}
let pos=[0,0,0];
const setCard=(x,y,r)=>{pos=[x,y,r];card.style.transform=`translate(${x}px,${y}px) rotate(${r}deg)`};
function place(at,anim=true){card.classList.toggle('noanim',!anim);setCard(...anchor(at));card.classList.toggle('under',at==='slot');card.classList.toggle('lift',at==='tap');
  if(!anim)card.getBoundingClientRect(),card.classList.remove('noanim');drawCable()}
function moveTo(to){const from=st.at;if(to===from){place(to);return}st.at=to;place(to);hints();moved(from,to)}
function zoneAt(){const c=card.getBoundingClientRect(),x=c.left+c.width/2,y=c.top+c.height/2,p=pad.getBoundingClientRect(),t=term.getBoundingClientRect(),m=c.width*.35;
  if(x>p.left-m&&x<p.right+m&&y>p.top-m&&y<p.bottom+m)return 'reader';
  if(x>t.left-c.width*.3&&x<t.right+c.width*.3){if(y>t.top-c.height*.6&&y<t.top+t.height*.55)return 'tap';if(y>t.bottom-t.height*.25&&y<t.bottom+c.height*.8)return 'slot'}
  return null}
const hot=z=>{pad.classList.toggle('hot',z==='reader');head.classList.toggle('hot',z==='tap');slot.classList.toggle('hot',z==='slot')};
function nudge(){if(st.at!=='reader'){moveTo('reader');return}
  if(st.ph==='present'){moveTo(T().iface);return}
  card.classList.remove('nope');card.getBoundingClientRect();card.classList.add('nope');
  if(free())coach(main()?'Run a test in ICCSimTMat first: highlight one and click Run Tests.':'Log in to ICCSimTMat and run a test first. The card stays on the reader until then.')}
let drag=null;
card.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();card.focus({preventScroll:true});card.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,o:[...pos],moved:false}});
card.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){if(Math.hypot(dx,dy)<6)return;drag.moved=true;card.classList.add('drag')}
  setCard(drag.o[0]+dx,drag.o[1]+dy,0);hot(zoneAt())});
const endDrag=cancel=>{if(!drag)return;const d=drag;drag=null;card.classList.remove('drag');hot(null);
  if(cancel){place(st.at);return}if(!d.moved){nudge();return}const z=zoneAt();if(z)moveTo(z);else place(st.at)};
card.addEventListener('pointerup',()=>endDrag(false));
card.addEventListener('pointercancel',()=>endDrag(true));
card.addEventListener('click',e=>{if(e.detail===0)nudge()});
$$('.desk-ctl button').forEach(b=>b.addEventListener('click',()=>moveTo(b.dataset.to)));
const keyPress=e=>{const b=e.target.closest('button');if(!b||b.disabled||st.ph!=='pin')return;const k=b.dataset.k;
  if(/\d/.test(k)){if(st.pin.length<4){st.pin+=k;pinScreen()}}
  else if(k==='c'){st.pin=st.pin.slice(0,-1);pinScreen()}
  else if(k==='x')finish('Cancelled');
  else if(st.pin.length<4){screen(money(T().amt),'Enter PIN','Four digits, please','pin');later(900,()=>{if(st.ph==='pin')pinScreen()})}
  else{keys(false);screen('Purchase','Processing','Please wait','busy');coach('The terminal is processing the payment.');later(900,()=>finish(T().decline?'Declined':'Approved'))}};

function drawCable(){const d=desk.getBoundingClientRect(),r=$('.reader').getBoundingClientRect(),x=r.left-d.left+r.width*.5,y=r.top-d.top;

function quiz(){const box=$('#ty');
  if(ty.k>=PUZZLES.length){const n=PUZZLES.length;
    box.innerHTML=`<div class="ty-end"><p class="ty-top"><span>Your score</span></p><p class="ty-big">${ty.score} of ${n}</p>
      <p>${ty.score===n?'All four right: you know your way round a failed test.':ty.score>=n/2?'Good going. The guide’s troubleshooting covers the rest.':'Worth another look: each answer explains what went wrong.'}</p>
      <div class="ty-act"><button class="btn" type="button" id="ty-again">${ic('again')}Try again</button><a class="btn gh" ${lnk(toHd('#g-getting-started-8'))}>Troubleshooting in the guide</a></div></div>`;
    $('#ty-again').addEventListener('click',()=>{ty.k=0;ty.score=0;quiz();$('#ty .ty-test').scrollIntoView({block:'nearest'})});return}
  const p=PUZZLES[ty.k];
  box.innerHTML=`<p class="ty-top"><span>Question ${ty.k+1} of ${PUZZLES.length}</span><span>Score ${ty.score}</span></p>
    <p class="ty-test"><span>The test</span>${esc(p.test)}</p>
    <div class="tw-wrap"><table class="tw-crit"><caption class="vh">What ICCSimTMat found</caption><thead><tr><th scope="col">Check</th><th scope="col">Expected</th><th scope="col">Found</th><th scope="col"><span class="vh">Result</span></th></tr></thead>
    <tbody>${p.rows.map((r,i)=>`<tr class="${i===p.bad?'bad':''}"><th scope="row">${esc(r[0])}</th><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${MK(i!==p.bad)}</td></tr>`).join('')}</tbody></table></div>
    <fieldset class="ty-q" id="ty-q"><legend>${esc(p.q)}</legend>${p.o.map((o,i)=>`<label><input type="radio" name="tyq" value="${i}"><span>${esc(o)}</span></label>`).join('')}</fieldset>
    <div class="ty-act"><button class="btn" type="button" id="ty-go" disabled>Check my answer</button></div>
    <div class="ty-fb" id="ty-fb" role="status" aria-live="polite"></div>`;
  const q=$('#ty-q'),go=$('#ty-go');let checked=false;
  $$('input',q).forEach(r=>r.addEventListener('change',()=>{go.disabled=false}));
  go.addEventListener('click',()=>{if(checked){ty.k++;quiz();return}
    const a=+$('input:checked',q).value,ok=a===p.a;checked=true;if(ok)ty.score++;
    $$('label',q).forEach((l,i)=>{if(i===p.a)l.classList.add('right');else if(i===a)l.classList.add('wrong')});q.disabled=true;
    $('#ty-fb').innerHTML=`<b>${ok?'Right.':'Not quite.'}</b>${esc(p.why)}`;
    go.textContent=ty.k<PUZZLES.length-1?'Next question':'See your score';go.focus()})}
